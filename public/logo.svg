<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <!-- Background circle -->
  <circle cx="200" cy="200" r="200" fill="#3D4466"/>

  <!-- Gear shape (outer) -->
  <g transform="translate(200,155)" fill="none" stroke="#F5C518" stroke-width="6">
    <!-- Simplified gear+brain icon: gear outline with circuit nodes -->
    <path d="M-55,-55 L-45,-70 L-30,-70 L-20,-55 L-55,-55 Z" fill="none"/>
    <!-- Brain left lobe -->
    <ellipse cx="-20" cy="-20" rx="28" ry="32" fill="none" stroke="#F5C518" stroke-width="5"/>
    <!-- Brain right lobe -->
    <ellipse cx="18" cy="-20" rx="28" ry="32" fill="none" stroke="#F5C518" stroke-width="5"/>
    <!-- Circuit lines -->
    <line x1="-50" y1="0" x2="-30" y2="0" stroke="#F5C518" stroke-width="4"/>
    <circle cx="-50" cy="0" r="5" fill="#F5C518"/>
    <line x1="50" y1="0" x2="30" y2="0" stroke="#F5C518" stroke-width="4"/>
    <circle cx="50" cy="0" r="5" fill="#F5C518"/>
    <line x1="0" y1="-60" x2="0" y2="-40" stroke="#F5C518" stroke-width="4"/>
    <circle cx="0" cy="-60" r="5" fill="#F5C518"/>
    <line x1="-40" y1="35" x2="-25" y2="20" stroke="#F5C518" stroke-width="4"/>
    <circle cx="-40" cy="35" r="5" fill="#F5C518"/>
    <line x1="40" y1="35" x2="25" y2="20" stroke="#F5C518" stroke-width="4"/>
    <circle cx="40" cy="35" r="5" fill="#F5C518"/>
    <!-- Center connection -->
    <line x1="-20" y1="-20" x2="18" y2="-20" stroke="#F5C518" stroke-width="3"/>
  </g>

  <!-- CODEship text -->
  <text x="200" y="268" font-family="Arial Black, sans-serif" font-size="52" font-weight="900" fill="white" text-anchor="middle" letter-spacing="-1">CODEship</text>

  <!-- Academy text (italic) -->
  <text x="200" y="300" font-family="Georgia, serif" font-size="28" font-style="italic" fill="white" text-anchor="middle">Academy</text>

  <!-- Yellow badge -->
  <rect x="80" y="318" width="240" height="40" rx="20" fill="#F5C518"/>
  <text x="200" y="344" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#3D4466" text-anchor="middle" letter-spacing="2">DREAM. CODE. ACHIEVE.</text>
</svg>
